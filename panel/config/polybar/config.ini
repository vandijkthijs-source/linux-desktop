[colors]
background = #20262e
panel = #2c3540
selected = #364150
foreground = #f5f7fb
muted = #aeb9c8
accent = #4da4ff
success = #77d19b
border = #3b4654

[bar/main]
width = 100%
height = 38px
offset-x = 0
offset-y = 0
bottom = false
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

radius = 0
border-size = 0px
border-color = ${colors.border}

font-0 = DejaVu Sans:size=10;2
font-1 = FontAwesome:size=11;3

padding-left = 15px
padding-right = 15px
module-margin = 10px

modules-left = launcher panel-pup-toggle flock-toggle
modules-center = date
modules-right = wlan bluetooth volume battery systray

enable-ipc = true
cursor-click = pointer

[module/launcher]
type = custom/text
label = Menu
label-foreground = ${colors.foreground}
label-font = 1
click-left = @HOME@/.local/bin/rofi-appmenu

[module/workspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.accent}
label-active-foreground = ${colors.background}
label-active-padding = 2

label-occupied = %name%
label-occupied-background = ${colors.panel}
label-occupied-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 2

label-urgent = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = #ff6f7d
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 10
date = %a %d %b
time = %H:%M
label = %date%  |  %time%
label-foreground = ${colors.foreground}

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <label-connected>
format-connected-prefix-font = 2
format-connected-prefix-foreground = ${colors.success}
label-connected = %{A1:@HOME@/.local/bin/wifi-menu.sh:}%{F#77d19b}%{T2}%{T-}%{F-}  %essid%%{A}
label-disconnected = %{A1:@HOME@/.local/bin/wifi-menu.sh:}%{F#77d19b}%{T2}%{T-}%{F-}  Wi-Fi offline%{A}
label-disconnected-foreground = ${colors.muted}

[module/volume]
type = internal/pulseaudio
format-volume = %{A1:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle:}<label-volume>%{A}
format-volume-prefix = "%{A1:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle:}  %{A}"
format-volume-prefix-font = 2
format-volume-prefix-foreground = ${colors.accent}
label-volume = %percentage%%
format-muted = %{A1:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle:}<label-muted>%{A}
format-muted-prefix = "%{A1:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle:}  %{A}"
format-muted-prefix-font = 2
format-muted-prefix-foreground = ${colors.accent}
label-muted = MUTED
label-muted-foreground = ${colors.muted}
scroll-up = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

[module/battery]
type = custom/script
exec = sh -c 'for f in /sys/class/power_supply/BAT*/capacity; do if [ -r "$f" ]; then read -r n < "$f"; case "$n" in *[!0-9]*|"") echo -;; *) [ "$n" -gt 100 ] && n=100; echo "$n";; esac; exit; fi; done; echo -'
interval = 30
format-prefix = "  "
format-prefix-font = 2
format-prefix-foreground = ${colors.success}
label = %output%%

[module/systray]
type = internal/tray
format-margin = 4px
tray-spacing = 5px

[module/panel-pup-toggle]
type = custom/script
exec = @HOME@/.local/bin/panel-pup-control status
click-left = @HOME@/.local/bin/panel-pup-control toggle
interval = 2
label = %output%
format-padding = 1

[module/bluetooth]
type = custom/text
label = %{F#aeb9c8}%{T2}%{T-}%{F-}  Bluetooth
label-foreground = ${colors.foreground}
click-left = @PANEL_DIR@/scripts/bluetooth-menu

[module/flock-toggle]
type = custom/script
exec = @HOME@/.local/bin/flock-control status
click-left = @HOME@/.local/bin/flock-control toggle
interval = 1
label = %output%
label-foreground = #c7ba94
format-padding = 1
